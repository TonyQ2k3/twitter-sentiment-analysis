apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend-svc
spec:
  selector:
    app: dashboard-backend
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
spec:
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      containers:
      - name: dashboard-backend-c
        image: tonyq2k3/dashboard-backend:1.2
        env:
          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: app-secret
                key: MONGO_URI
          - name: REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: IP_REDIS
          - name: REDIS_PORT
            value: "6379"
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-secret
                key: REDIS_PASSWORD
          - name: CRAWL_API
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: IP_CRAWL_API
        resources:
          limits:
            memory: 256Mi
            cpu: "0.4"
        ports:
        - containerPort: 8000