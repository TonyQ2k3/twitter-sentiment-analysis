# Pod service
apiVersion: v1
kind: Service
metadata:
  name: crawler-svc
spec:
  selector:
    name: crawler-server
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090

---
apiVersion: v1
kind: Pod
metadata:
  name: crawler-server
  labels:
    name: crawler-server
spec:
  containers:
  - name: crawler-server
    image: tonyq2k3/reddit-crawler-server:1.0.0
    # imagePullPolicy: Always
    ports:
    - containerPort: 8090
    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
    env:
    - name: BOOTSTRAP_SERVERS
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: IP_KAFKA_BROKER
    - name: USER
      valueFrom:
        secretKeyRef:
          name: crawler-secret
          key: USER
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: crawler-secret
          key: PASSWORD
    - name: CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: crawler-secret
          key: CLIENT_ID
    - name: CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: crawler-secret
          key: CLIENT_SECRET
    - name: USER_AGENT
      valueFrom:
        secretKeyRef:
          name: crawler-secret
          key: USER_AGENT
